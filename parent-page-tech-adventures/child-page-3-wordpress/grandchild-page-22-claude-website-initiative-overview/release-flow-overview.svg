<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#f7f9fb"/>
  <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#0D3C5E">A business website, released like software</text>
  <text x="600" y="98" text-anchor="middle" font-size="19" fill="#4a5a68">One repo · three sites · tested before and after every deploy · driven by Claude skills</text>

  <!-- skills band -->
  <rect x="70" y="130" width="1060" height="70" rx="12" fill="#e8eef4" stroke="#b9c8d6"/>
  <text x="600" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#0D3C5E">"in petcoach-website, change the …"</text>
  <text x="600" y="186" text-anchor="middle" font-size="16" fill="#4a5a68">router skill → website-start → website-change → website-release-uat → website-release-prod</text>

  <!-- three sites -->
  <g>
    <rect x="70" y="250" width="300" height="200" rx="14" fill="#ffffff" stroke="#3D6D8C" stroke-width="2"/>
    <text x="220" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="#0D3C5E">Local</text>
    <text x="220" y="318" text-anchor="middle" font-size="15" fill="#4a5a68">local.petcoach.sg, on each Mac</text>
    <text x="220" y="352" text-anchor="middle" font-size="15" fill="#333">feature branch</text>
    <text x="220" y="378" text-anchor="middle" font-size="15" fill="#333">iterate freely</text>
    <text x="220" y="404" text-anchor="middle" font-size="15" fill="#333">one local check when happy</text>
  </g>
  <g>
    <rect x="450" y="250" width="300" height="200" rx="14" fill="#ffffff" stroke="#3D6D8C" stroke-width="2"/>
    <text x="600" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="#0D3C5E">Staging (UAT)</text>
    <text x="600" y="318" text-anchor="middle" font-size="15" fill="#4a5a68">staging.petcoach.sg, noindex</text>
    <text x="600" y="352" text-anchor="middle" font-size="15" fill="#333">main + uat-YYYY-MM-DD-N tag</text>
    <text x="600" y="378" text-anchor="middle" font-size="15" fill="#333">one batch, ships whole</text>
    <text x="600" y="404" text-anchor="middle" font-size="15" fill="#333">full before/after tests</text>
  </g>
  <g>
    <rect x="830" y="250" width="300" height="200" rx="14" fill="#ffffff" stroke="#CF515E" stroke-width="2"/>
    <text x="980" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="#CF515E">Live (Prod)</text>
    <text x="980" y="318" text-anchor="middle" font-size="15" fill="#4a5a68">petcoach.sg</text>
    <text x="980" y="352" text-anchor="middle" font-size="15" fill="#333">prod tag on the same commit</text>
    <text x="980" y="378" text-anchor="middle" font-size="15" fill="#333">explicit "yes" in chat</text>
    <text x="980" y="404" text-anchor="middle" font-size="15" fill="#333">tests again after deploy</text>
  </g>
  <g fill="none" stroke="#0D3C5E" stroke-width="3">
    <path d="M375 350 L442 350"/><path d="M755 350 L822 350"/>
  </g>
  <g fill="#0D3C5E"><path d="M442 342 L452 350 L442 358 Z"/><path d="M822 342 L832 350 L822 358 Z"/></g>
  <text x="410" y="335" text-anchor="middle" font-size="13" fill="#0D3C5E">code up</text>
  <text x="790" y="335" text-anchor="middle" font-size="13" fill="#0D3C5E">batch</text>

  <!-- data down -->
  <path d="M980 470 C 980 540, 220 540, 220 470" fill="none" stroke="#8aa0b2" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M212 478 L220 462 L228 478 Z" fill="#8aa0b2"/>
  <text x="600" y="565" text-anchor="middle" font-size="16" fill="#4a5a68">data flows down: staging and Local are refreshed from the live database, never the other way</text>
  <text x="600" y="600" text-anchor="middle" font-size="14" fill="#8aa0b2">blog.shafikwalakaka.com</text>
</svg>
